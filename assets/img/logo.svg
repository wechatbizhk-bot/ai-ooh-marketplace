<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="3dNakedEye — AI OOH Marketplace">
  <title>3dNakedEye</title>
  <defs>
    <linearGradient id="dne-lock-mark" x1="6" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35d0ff"/>
      <stop offset=".52" stop-color="#0b5fff"/>
      <stop offset="1" stop-color="#6b4dff"/>
    </linearGradient>
    <linearGradient id="dne-lock-word" x1="104" y1="30" x2="300" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5fff"/>
      <stop offset="1" stop-color="#6b4dff"/>
    </linearGradient>
  </defs>

  <!-- mark: eye + isometric cube + blade sweep -->
  <g transform="translate(6 6) scale(1.85)">
    <path d="M3.2 24c6.7-9.7 14.1-14.4 20.8-14.4S38.1 14.3 44.8 24c-6.7 9.7-14.1 14.4-20.8 14.4S9.9 33.7 3.2 24Z"
          fill="none" stroke="url(#dne-lock-mark)" stroke-width="2.7" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="9.9" fill="url(#dne-lock-mark)" opacity=".14"/>
    <circle cx="24" cy="24" r="9.9" fill="none" stroke="url(#dne-lock-mark)" stroke-width="1.5" opacity=".5"/>
    <path d="M24 15.6 31 19.6 24 23.6 17 19.6Z" fill="#cdefff"/>
    <path d="M17 19.6 24 23.6v8.2l-7-4Z" fill="#0b5fff"/>
    <path d="M31 19.6v8.2l-7 4v-8.2Z" fill="#6b4dff"/>
    <path d="M33.4 15.9a12.6 12.6 0 0 1 3.3 7.4" fill="none" stroke="#ff5470" stroke-width="2.1" stroke-linecap="round"/>
  </g>

  <!-- wordmark: "3d" carries the gradient, "NakedEye" stays ink for legibility -->
  <text x="104" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="800" letter-spacing="-1.1">
    <tspan fill="url(#dne-lock-word)">3d</tspan><tspan fill="#0d213a">NakedEye</tspan>
  </text>
  <text x="105" y="73" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="2.6" fill="#5b6f8c">AI OOH MARKETPLACE</text>
</svg>
