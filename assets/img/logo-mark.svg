<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="3dNakedEye">
  <title>3dNakedEye</title>
  <defs>
    <linearGradient id="dne-mark" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35d0ff"/>
      <stop offset=".52" stop-color="#0b5fff"/>
      <stop offset="1" stop-color="#6b4dff"/>
    </linearGradient>
    <linearGradient id="dne-cube-top" x1="17" y1="16" x2="31" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#9fe8ff"/>
    </linearGradient>
    <linearGradient id="dne-cube-right" x1="24" y1="24" x2="31" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b4dff"/>
      <stop offset="1" stop-color="#3f2bd6"/>
    </linearGradient>
  </defs>

  <!-- the eye: what the viewer needs no glasses for -->
  <path d="M3.2 24c6.7-9.7 14.1-14.4 20.8-14.4S38.1 14.3 44.8 24c-6.7 9.7-14.1 14.4-20.8 14.4S9.9 33.7 3.2 24Z"
        fill="none" stroke="url(#dne-mark)" stroke-width="2.7" stroke-linejoin="round"/>

  <!-- iris -->
  <circle cx="24" cy="24" r="9.9" fill="url(#dne-mark)" opacity=".14"/>
  <circle cx="24" cy="24" r="9.9" fill="none" stroke="url(#dne-mark)" stroke-width="1.5" opacity=".5"/>

  <!-- the 3d: an isometric cube floating in the iris -->
  <path d="M24 15.6 31 19.6 24 23.6 17 19.6Z" fill="url(#dne-cube-top)"/>
  <path d="M17 19.6 24 23.6v8.2l-7-4Z" fill="#0b5fff"/>
  <path d="M31 19.6v8.2l-7 4v-8.2Z" fill="url(#dne-cube-right)"/>
  <path d="M24 15.6 31 19.6 24 23.6 17 19.6Z M17 19.6 24 23.6v8.2l-7-4Z M31 19.6v8.2l-7 4v-8.2Z"
        fill="none" stroke="#061426" stroke-width=".7" stroke-linejoin="round" opacity=".5"/>

  <!-- the rotating blade sweep of the fan -->
  <path d="M33.4 15.9a12.6 12.6 0 0 1 3.3 7.4" fill="none" stroke="#ff5470" stroke-width="2.1"
        stroke-linecap="round" opacity=".95"/>
  <circle cx="19.9" cy="19.4" r="1.5" fill="#ffffff" opacity=".85"/>
</svg>
